name: Collect security news

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed so the workflow can save the new data

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collector/collect.py

      - name: Save updated data
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update security news data" && git push)
